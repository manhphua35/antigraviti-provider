[package]
name = "antigravity-tray"
version = "0.1.0"
edition = "2024"

[dependencies]
brotli-decompressor = "6.1.1"
tao = "0.37.1"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }
winreg = "0.56.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
